{% extends 'base.html' %}
{% block title %}Log In - Convene{% endblock %}
{% block content %}
<h1>Log In</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log In</button>
</form>
<p>No account? <a href="{% url 'register' %}">Register here</a></p>
{% endblock %}
